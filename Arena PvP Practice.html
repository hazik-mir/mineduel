const m=new T.Matrix4();AR.pal.forEach((p,pi)=>{const l=ls[pi],n=l.length/3;if(!n)return;
const im=new T.InstancedMesh(bgeo,p[1]?lam(texOf(p[1]),0xffffff):lam(tA,p[0]),n);
for(let k=0;k<n;k++){m.setPosition(l[k*3]-ox+.5,l[k*3+1]-1.5,l[k*3+2]-oz+.5);im.setMatrixAt(k,m)}scene.add(im)})}

const blocks=new Map(),bgeo=new T.BoxGeometry(1,1,1);const key=(x,y,z)=>x+','+y+','+z;
const solid=(x,y,z)=>blocks.has(key(x,y,z))||solidA(x,y,z);
function addBlock(x,y,z,t){if(blocks.has(key(x,y,z)))return;const m=new T.Mesh(bgeo,bmats[t]);m.position.set(x+.5,y+.5,z+.5);scene.add(m);blocks.set(key(x,y,z),m)}
function delBlock(x,y,z){const m=blocks.get(key(x,y,z));if(m){scene.remove(m);blocks.delete(key(x,y,z));return true}}
function clearBlocks(){[...blocks.values()].forEach(m=>scene.remove(m));blocks.clear()}

// sound (soft, filtered, M to mute)
let ac,mg,nb,mute=false;
function initAudio(){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.5;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4000;mg.connect(lp);lp.connect(ac.destination);
const n=ac.sampleRate*.5;nb=ac.createBuffer(1,n,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<n;i++)a[i]=R()*2-1}
const env=(g,t,at,d,v)=>{g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+at+d)};
const tone=(f1,f2,d,ty,v,dl=0)=>{if(!mg||mute)return;const t=ac.currentTime+dl,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,.008,d,v);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)};
const noise=(d,v,f,ty)=>{if(!mg||mute)return;const t=ac.currentTime,s=ac.createBufferSource(),fi=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;fi.type=ty||'lowpass';fi.frequency.value=f;env(g,t,.006,d,v);s.connect(fi);fi.connect(g);g.connect(mg);s.start(t);s.stop(t+d+.05)};
const SND={swing:()=>noise(.1,.05,1500,'bandpass'),hit:()=>{tone(210,90,.1,'sine',.5);noise(.08,.3,1500)},hurt:()=>{tone(190,110,.16,'triangle',.45);noise(.09,.2,700)},
place:()=>{tone(430,270,.07,'sine',.35);noise(.05,.15,2200)},brk:()=>{noise(.15,.3,1300);tone(160,80,.1,'sine',.25)},
win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.45,'sine',.25,i*.14)),lose:()=>[392,349,311,262].forEach((f,i)=>tone(f,f,.45,'sine',.22,i*.18))};

// physics
const mk=()=>({p:new T.Vector3(),v:new T.Vector3(),g:false,inv:0});const pl=mk(),bot=mk();bot.cd=0;bot.t=0;bot.w=0;
function hits(e){const x0=Math.floor(e.p.x-.3),x1=Math.floor(e.p.x+.3),y0=Math.floor(e.p.y),y1=Math.floor(e.p.y+1.79),z0=Math.floor(e.p.z-.3),z1=Math.floor(e.p.z+.3);
for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)if(solid(x,y,z))return true;return false}
function phys(e,dt){const n=3,d=dt/n;e.v.y-=26*dt;e.g=false;
for(let s=0;s<n;s++)for(const a of['x','y','z']){const o=e.p[a];e.p[a]+=e.v[a]*d;
if(hits(e)){if(a==='y'){if(e.v.y<0){e.p.y=Math.floor(e.p.y)+1;e.g=true}else e.p.y=Math.floor(e.p.y+1.8)-1.8-.001}else e.p[a]=o;e.v[a]=0}}}
function accel(e,tx,tz,a,dt){let dx=tx-e.v.x,dz=tz-e.v.z;const m=Math.hypot(dx,dz),k=a*dt;if(m>k){dx*=k/m;dz*=k/m}e.v.x+=dx;e.v.z+=dz}
function hit(v,a,h,up){if(v.inv>0)return false;v.inv=v===bot?.3:.45;let dx=v.p.x-a.p.x,dz=v.p.z-a.p.z;const l=Math.hypot(dx,dz)||1;v.v.set(dx/l*h,up,dz/l*h);v.g=false;return true}

// bot model (Minecraft proportions + pack's diamond armor)
const botG=new T.Group();scene.add(botG);const botMats=[],PX=.05625;
function uvBox(a,b,c,u,v,f){const g=new T.BoxGeometry(a*PX*f,b*PX*f,c*PX*f),uv=g.attributes.uv;
[[u,v+c,c,b],[u+c+a,v+c,c,b],[u+c,v,a,c],[u+c+a,v,a,c],[u+2*c+a,v+c,a,b],[u+c,v+c,a,b]].forEach(([x,y,w,h],i)=>{const u0=x/64,u1=(x+w)/64,v1=1-y/32,v0=1-(y+h)/32;
[[u0,v1],[u1,v1],[u0,v0],[u1,v0]].forEach((q,j)=>uv.setXY(i*4+j,q[0],q[1]))});return g}
const bm=c=>{const m=lam(tBot,c);botMats.push(m);return m},am=n=>{const m=new T.MeshLambertMaterial({map:texOf(n),transparent:true,alphaTest:.1});botMats.push(m);return m};
const add=(g,x,y,z,m)=>{const o=new T.Mesh(g,m);o.position.set(x*PX,y*PX,z*PX);botG.add(o)};
[[8,8,8,0,0,0,28,0xffcf9e],[8,12,4,16,16,0,18,0xe06a3a],[4,12,4,40,16,6,18,0xffcf9e],[4,12,4,40,16,-6,18,0xffcf9e],[4,12,4,0,16,2,6,0x3a56c8],[4,12,4,0,16,-2,6,0x3a56c8]].forEach(([a,b,c,u,v,x,y,col],i)=>{
add(uvBox(a,b,c,u,v,1),x,y,0,bm(col));add(uvBox(a,b,c,u,v,1.12),x,y,0,am('diamond_1'));if(i>3)add(uvBox(a,b,c,u,v,1.07),x,y,0,am('diamond_2'))});
add(new T.BoxGeometry(.1,.07,.03),-2.2,28.5,-4.3,bm(0x202020));add(new T.BoxGeometry(.1,.07,.03),2.2,28.5,-4.3,bm(0x202020));

// held items: pack's diamond sword sprite (extruded) + selected block
const dm=(w,h,d,x,y,z,c)=>{const m=lam(tBot,c);m.depthTest=false;const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.renderOrder=10;return o};
const rig=new T.Group();rig.position.set(.42,-.42,-.3);cam.add(rig);rig.add(dm(.14,.14,.5,0,0,-.2,0xffcf9e));
const sw=new T.Group();sw.position.set(.02,.32,-.5);sw.rotation.set(-.5,0,Math.PI/4);rig.add(sw);
{const p=.075,im=new T.InstancedMesh(new T.BoxGeometry(p,p,p*1.3),new T.MeshBasicMaterial({depthTest:false}),SW.length),m=new T.Matrix4(),c=new T.Color();
SW.forEach(([x,y,h],i)=>{m.setPosition((x-7.5)*p,(7.5-y)*p,0);im.setMatrixAt(i,m);im.setColorAt(i,c.setHex(h))});im.renderOrder=10;im.frustumCulled=false;sw.add(im)}
const hmats=BN.map(n=>{const m=lam(texOf('concrete_'+n),0xffffff);m.depthTest=false;return m});
const hb=dm(.3,.3,.3,-.5,-.4,-.8,0xffffff);hb.rotation.set(.2,.6,0);cam.add(hb);cam.add(dm(.14,.14,.4,-.4,-.5,-.55,0xffcf9e));
const hbE=document.getElementById('hb');BN.forEach((n,i)=>{const d=document.createElement('div');d.style.backgroundImage=`url(${TX['concrete_'+n]})`;d.textContent=i+1;hbE.appendChild(d)});
function selUI(){[...hbE.children].forEach((d,i)=>d.className=i===sel?'on':'');hb.material=hmats[sel]}selUI();

// input
const K={},M={};let yaw=0,pitch=0,locked=false,over=false,ready=false,sc=[0,0],swing=0,swingCd=0,placeCd=0;
const ov=document.getElementById('ov'),msg=document.getElementById('msg'),hud=document.getElementById('hud'),fl=document.getElementById('flash');
addEventListener('keydown',e=>{K[e.code]=true;if(e.code==='Space')e.preventDefault();if(/^Digit[1-8]$/.test(e.code)){sel=+e.code[5]-1;selUI()}if(e.code==='KeyM'){mute=!mute;hud.querySelector('small').textContent=mute?'sound muted (M)':'first to 100 hits wins'}});addEventListener('keyup',e=>K[e.code]=false);
addEventListener('contextmenu',e=>e.preventDefault());
ov.onclick=()=>{if(!ready)return;if(!ac)initAudio();if(over)reset();ren.domElement.requestPointerLock()};
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===ren.domElement;ov.style.display=locked?'none':'flex'});
addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.55,Math.min(1.55,pitch-e.movementY*.0022))});
addEventListener('mousedown',e=>{if(!locked)return;M[e.button]=true;if(e.button===0)attack(true)});addEventListener('mouseup',e=>M[e.button]=false);

const eye=()=>new T.Vector3(pl.p.x,pl.p.y+1.62,pl.p.z);
function ray(){const o=eye(),d=new T.Vector3();cam.getWorldDirection(d);let prev=null;
for(let t=0;t<=5;t+=.04){const c=[Math.floor(o.x+d.x*t),Math.floor(o.y+d.y*t),Math.floor(o.z+d.z*t)];if(solid(...c))return{h:c,prev};prev=c}return null}
function attack(fresh){if(swingCd>0)return;swing=1;swingCd=.22;
const o=eye(),d=new T.Vector3();cam.getWorldDirection(d);const c=bot.p.clone();c.y+=.9;const to=c.sub(o),t=to.dot(d),dist=to.length();
if(t>0&&dist<4.2&&to.clone().sub(d.clone().multiplyScalar(t)).length()<1){if(hit(bot,pl,6,8.5)){sc[0]++;SND.hit();score()}return}
SND.swing();if(fresh){const r=ray();if(r&&delBlock(...r.h))SND.brk()}}
function place(){const r=ray();if(!r||!r.prev)return;const[x,y,z]=r.prev;if(y<0||y>60||solid(x,y,z))return;
for(const e of[pl,bot])if(Math.abs(e.p.x-(x+.5))<.8&&Math.abs(e.p.z-(z+.5))<.8&&e.p.y<y+1&&e.p.y+1.8>y)return;addBlock(x,y,z,sel);SND.place()}
function score(){hud.innerHTML=`YOU ${sc[0]} — ${sc[1]} BOT<small>first to 100 hits wins</small>`;
if(sc[0]>=100||sc[1]>=100){over=true;document.exitPointerLock();const w=sc[0]>=100;w?SND.win():SND.lose();ov.innerHTML=`<h1>${w?'YOU WIN':'BOT WINS'}</h1><div>${sc[0]} — ${sc[1]}<br>Click to play again<br><b>Credits: heyhazik</b></div>`}}
function spawn(){pl.p.set(0,0,9);pl.v.set(0,0,0);pl.inv=1;bot.p.set(0,0,-9);bot.v.set(0,0,0);bot.inv=1;bot.w=0;yaw=0;pitch=0}
function reset(){sc=[0,0];over=false;clearBlocks();spawn();score()}

(async()=>{const u=Uint8Array.from(atob(AR.data),c=>c.charCodeAt(0));
grid=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
buildArena();reset();ready=true;msg.innerHTML=INFO})();

let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
if(ready&&locked&&!over){
pl.inv-=dt;bot.inv-=dt;swingCd-=dt;placeCd-=dt;
const f=(K.KeyW?1:0)-(K.KeyS?1:0),r=(K.KeyD?1:0)-(K.KeyA?1:0);let wx=-Math.sin(yaw)*f+Math.cos(yaw)*r,wz=-Math.cos(yaw)*f-Math.sin(yaw)*r;
const wl=Math.hypot(wx,wz),sp=(K.ShiftLeft||K.ShiftRight||K.ControlLeft)?7.6:5.6;
if(wl>0){wx=wx/wl*sp;wz=wz/wl*sp}
if(pl.g||wl>0)accel(pl,wx,wz,pl.g?70:14,dt);
if(K.Space&&pl.g){pl.v.y=8.4;pl.g=false}
phys(pl,dt);if(pl.p.y<-12)spawn();
if(M[0])attack(false);if(M[2]&&placeCd<=0){place();placeCd=.13}
// bot (easier: slower, wind-up, misses sometimes)
bot.t+=dt;bot.cd-=dt;const dx=pl.p.x-bot.p.x,dz=pl.p.z-bot.p.z,dist=Math.hypot(dx,dz)||1,nx=dx/dist,nz=dz/dist;
const st=Math.sin(bot.t*1.6)*(dist<5?1.4:0);let tx=nx*4.2-nz*st,tz=nz*4.2+nx*st;if(dist<1.6){tx=-nx*2;tz=-nz*2}
if(bot.g||bot.inv<=0)accel(bot,tx,tz,bot.g?45:12,dt);
if(bot.g&&bot.inv<=0&&(dist>7||R()<.006||(Math.hypot(bot.v.x,bot.v.z)<1&&dist>2))){bot.v.y=8.2;bot.g=false}
phys(bot,dt);if(bot.p.y<-12){bot.p.set(-pl.p.x*.7,0,-pl.p.z*.7-3);bot.v.set(0,0,0);bot.inv=1}
if(dist<2.7&&Math.abs(pl.p.y-bot.p.y)<1.6&&bot.cd<=0){bot.w+=dt;if(bot.w>.25){bot.w=0;bot.cd=.9+R()*.4;SND.swing();
if(R()<.65&&hit(pl,bot,8,10)){sc[1]++;SND.hurt();score();fl.style.opacity=.45}}}else bot.w=0;
fl.style.opacity=Math.max(0,fl.style.opacity-dt*2);
}
botG.position.copy(bot.p);botG.rotation.y=Math.atan2(pl.p.x-bot.p.x,pl.p.z-bot.p.z)+Math.PI;
botMats.forEach(m=>m.emissive.setHex(bot.inv>.15?0x884444:0));
cam.position.set(pl.p.x,pl.p.y+1.62,pl.p.z);cam.rotation.set(pitch,yaw,0);
if(swing>0)swing-=dt*4.5;const a=swing>0?Math.sin(Math.PI*(1-swing)):0;
rig.rotation.set(.15-a*1.1,0,-a*.3);
ren.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
